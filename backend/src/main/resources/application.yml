spring:
  # Development database. Runtime H2 files are ignored by Git.
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./prodDb;AUTO_SERVER=TRUE
    username: sa
    password: <REDACTED>

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 100MB      # 单个文件最大大小 (您可以根据需求修改，如 50MB, 100MB)
      max-request-size: 100MB
jwt:
  # Demo-only key for local development. Replace it outside the repository.
  secret: <REDACTED>
file:
  upload-dir: ./uploads/

server:
  port: 8443
  ssl:
    enabled: false
