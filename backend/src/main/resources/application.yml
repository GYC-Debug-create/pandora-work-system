spring:
  # Use the file-based H2 database
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./prodDb;AUTO_SERVER=TRUE
    username: sa
    password: <REDACTED>

  # This line explicitly tells Spring Boot to always run schema.sql
  sql:
    init:
      mode: always

  # H2 console configuration
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 100MB      # 单个文件最大大小 (您可以根据需求修改，如 50MB, 100MB)
      max-request-size: 100MB
jwt:
  secret: <REDACTED>
file:
  upload-dir: ./uploads/