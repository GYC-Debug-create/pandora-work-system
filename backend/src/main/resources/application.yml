spring:
  # Use the file-based H2 database
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./prodDb;AUTO_SERVER=TRUE
    username: sa
    password: <REDACTED>

  # This line explicitly tells Spring Boot to always run schema.sql
  sql:
    init:
      mode: always

  # H2 console configuration
  h2:
    console:
      enabled: true
      path: /h2-console
jwt:
  secret: <REDACTED>
file:
  upload-dir: ./uploads/