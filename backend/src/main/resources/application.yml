spring:
  # Development database. Runtime H2 files are ignored by Git.
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./prodDb;AUTO_SERVER=TRUE
    username: sa
    password: <REDACTED>

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 100MB      # 单个文件最大大小 (您可以根据需求修改，如 50MB, 100MB)
      max-request-size: 100MB
jwt:
  # JWT 签名密钥只从环境变量 JWT_SECRET 读取，仓库里不保存任何密钥。
  # 冒号后留空只是为了让 JwtUtil 在未设置时给出明确报错（空值不是可用密钥，启动会直接失败）。
  secret: ${JWT_SECRET:}
file:
  upload-dir: ./uploads/

server:
  port: 8443
  ssl:
    enabled: false
